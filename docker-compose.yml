# ===========================================================================
# Campuslands AI Academy · Reto 4
# Landing → Formulario → Spring Boot → PostgreSQL → n8n → Telegram → Panel
#
#   docker compose up -d --build
#
# Funciona SIN .env (valores locales por defecto). Para claves propias usa
# ./scripts/generar-env.sh (Windows: scripts\generar-env.ps1) o copia .env.example.
# Si no defines ADMIN_PASSWORD, la contraseña del panel se genera y se consulta con:
#   docker compose logs backend | grep -A3 CONTRASE
#
#   Landing:  http://localhost:8080        Panel: http://localhost:8080/admin/
#   API:      http://localhost:8081/api    n8n:   http://localhost:5678
#
# Los datos viven en volúmenes con nombre. `docker compose down` NO los borra
# (solo `docker compose down -v`, que nunca se ejecuta automáticamente).
# ===========================================================================
name: campuslands-reto4

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Entrypoint oficial + sincronización de la contraseña con .env (postgres/start-postgres.sh).
    # «tr» quita los \r por si el script se guardó con fines de línea de Windows.
    entrypoint:
      - /bin/sh
      - -c
      - tr -d '\r' < /opt/campuslands/start-postgres.sh > /tmp/start-postgres.sh && exec /bin/sh /tmp/start-postgres.sh
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campuslands_leads}
      POSTGRES_USER: ${POSTGRES_USER:-campuslands}
      # Valor local por defecto (el puerto solo se publica en 127.0.0.1). Cámbialo en .env para producción.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campuslands_local}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/start-postgres.sh:/opt/campuslands/start-postgres.sh:ro
    ports:
      # Solo en la máquina local, para revisar la BD con psql/pgAdmin/DBeaver.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      # Por TCP y con contraseña: el backend arranca solo cuando la clave ya está sincronizada.
      test:
        - CMD-SHELL
        - PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc 'select 1' > /dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [campuslands-red]

  backend:
    build:
      context: ./backend
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    image: campuslands/leads-api:1.0.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-campuslands_leads}
      DB_USER: ${POSTGRES_USER:-campuslands}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-campuslands_local}
      # Vacío = el backend genera uno aleatorio en cada arranque (las sesiones del panel se cierran al reiniciar).
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@campuslands.com}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador AI Academy}
      # Vacío = se genera una contraseña aleatoria y se muestra una sola vez en el log del backend.
      # Si la defines (o la cambias) aquí, se aplica al administrador en el siguiente arranque.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4321,http://localhost:8080}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/campuslands-nuevo-interesado}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks: [campuslands-red]

  n8n:
    image: n8nio/n8n:1.123.5
    restart: unless-stopped
    # «tr» quita los \r por si el script se guardó con fines de línea de Windows.
    entrypoint:
      - tini
      - --
      - /bin/sh
      - -c
      - tr -d '\r' < /opt/campuslands/start-n8n.sh > /tmp/start-n8n.sh && exec /bin/sh /tmp/start-n8n.sh
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
      N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: "false" # acceso por http en local; usa https y true en producción
      # Vacío = n8n genera su clave y la guarda en el volumen n8n_data (recomendado).
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false" # el workflow lee el token y el chat_id de variables de entorno
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      DB_SQLITE_POOL_SIZE: "2"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_AUTO_IMPORT: ${N8N_AUTO_IMPORT:-true}
      GENERIC_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      TZ: ${APP_TIMEZONE:-America/Bogota}
      # Valores que usa el workflow (nunca se guardan dentro del JSON).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-https://api.telegram.org}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./n8n/start-n8n.sh:/opt/campuslands/start-n8n.sh:ro
      - ./n8n/publicar-workflow.cjs:/opt/campuslands/publicar-workflow.cjs:ro
    ports:
      - "${N8N_PORT:-5678}:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [campuslands-red]

  frontend:
    build:
      context: ./frontend
    image: campuslands/landing-admin:1.0.0
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [campuslands-red]

networks:
  campuslands-red:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
