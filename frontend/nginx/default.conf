# Nginx: sirve la landing y el panel, y hace de proxy inverso de la API.
#   /          → landing de Astro (dist/index.html)
#   /admin/    → panel administrativo (dist/admin/index.html)
#   /api/...   → backend Spring Boot (servicio «backend» de docker-compose)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # DNS interno de Docker: resuelve «backend» en cada petición, así Nginx
    # arranca aunque el backend todavía no esté listo.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        # $http_host conserva el puerto público (p. ej. localhost:8080) para las URL que arma el backend.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /admin/index.html;
    }

    # Recursos con hash en el nombre: caché larga.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(webp|png|ico|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
